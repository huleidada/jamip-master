[metadata]
name = jamip
version = 1.2.0
description = 'Python Package for HTP calculation.'
license = 'Jilin University, BSD License'
author = 'Xin-Gang Zhao, Kun Zhou, Bangyu Xing, Ruoting Zhao, Jiahao Jie'
author_email = 'admin@jamip-code.com'
url = 'http://www.jamip-code.com'
platforms = 'Linux'

[options]
packages = find:
include_package_data = True
python_requires = >=3.6
install_requires =
    scikit-learn >= 0.22
    ruamel.yaml >= 0.16
    django >= 3.1, < 3.2
    numpy >= 1.14
    scipy >= 1.4
    spglib >= 1.15
    matplotlib
    mendeleev
    phonopy
    psutil
    filelock
    argcomplete
    jinja2

[options.entry_points]
console_scripts =
    jp = jamip.cui.script:main
