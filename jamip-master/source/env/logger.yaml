version: 1
disable_existing_loggers: False
formatters:
  simple:
    format: '[%(levelname)s] - %(message)s'
  standard:
    format: '%(asctime)s - %(levelname)s - %(message)s'
    datefmt: '%m/%d/%Y %H:%M:%S'
handlers:
  file:
    class : logging.handlers.RotatingFileHandler
    formatter: standard
    filename: jamip.log
    level   : INFO
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
root:
  handlers: 
    - file
    - console
  level: INFO
